services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  migrate:
    build: .
    command: ["migrate"]
    environment:
      AIGW_ENVIRONMENT: local
      AIGW_DB_DSN: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      AIGW_AUTH_API_KEY_PEPPER_REF: literal://local-dev-pepper-change-me
      AIGW_PROVIDER_ENABLED: '["echo"]'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    ports:
      - "8000:8000"
    environment:
      AIGW_ENVIRONMENT: local
      AIGW_DB_DSN: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      AIGW_REDIS_URL: redis://redis:6379/0
      AIGW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AIGW_KAFKA_ENABLED: "false"
      AIGW_AUTH_API_KEY_PEPPER_REF: literal://local-dev-pepper-change-me
      AIGW_AUTH_JWT_ENABLED: "false"
      AIGW_PROVIDER_ENABLED: '["echo"]'
      AIGW_OTEL_LOG_FORMAT: console
      AIGW_OTEL_LOG_LEVEL: INFO
      AIGW_DOCS_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["worker"]
    environment:
      AIGW_ENVIRONMENT: local
      AIGW_DB_DSN: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      AIGW_REDIS_URL: redis://redis:6379/0
      AIGW_KAFKA_ENABLED: "false"
      AIGW_AUTH_API_KEY_PEPPER_REF: literal://local-dev-pepper-change-me
      AIGW_PROVIDER_ENABLED: '["echo"]'
      AIGW_OTEL_LOG_FORMAT: console
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  postgres_data:
