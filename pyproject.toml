[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-integration-gateway"
version = "1.0.0"
description = "Secure, multi-provider AI integration gateway with routing, resilience, metering and observability."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Platform Engineering" }]
keywords = ["llm", "gateway", "fastapi", "clean-architecture", "observability"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "redis>=5.0",
  "aiokafka>=0.10",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42.0",
  "orjson>=3.10",
  "typer>=0.12",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "respx>=0.21",
  "coverage[toml]>=7.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-redis>=4.6",
  "pre-commit>=3.7",
  "hypothesis>=6.100",
]

[project.urls]
Documentation = "https://github.com/example-org/ai-integration-gateway/tree/main/docs"
Source = "https://github.com/example-org/ai-integration-gateway"

[project.scripts]
ai-gateway = "ai_gateway.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]

# --------------------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "TID",  # tidy imports
  "RUF",  # ruff specific
  "ASYNC",
  "S",    # bandit
  "D",    # pydocstyle
  "ANN",  # annotations
  "PL",   # pylint
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN401", # allow Any in narrowly-typed adapter seams
  "PLR0913",
  "S105",   # false positives on token type constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "D100", "D101", "D102", "D103", "D104", "D107", "E501", "PLR2004", "PLC0415", "ANN", "B017", "SIM"]
"migrations/**" = ["D", "ANN", "N999"]
"src/ai_gateway/infrastructure/persistence/models.py" = ["A003"]
"src/ai_gateway/infrastructure/providers/**" = ["PLR2004", "PLR0912"]
"src/ai_gateway/cli.py" = ["PLC0415"]
"src/ai_gateway/container.py" = ["PLC0415"]
"src/ai_gateway/observability/tracing.py" = ["PLC0415"]
"src/ai_gateway/infrastructure/events/kafka_publisher.py" = ["PLC0415"]
"src/ai_gateway/workers/jobs.py" = ["PLC0415"]
"src/ai_gateway/api/deps.py" = ["PLR0917"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------------------
# MyPy
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = false
disallow_untyped_decorators = false
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = "(^migrations/versions/)"

[[tool.mypy.overrides]]
module = [
  "aiokafka.*",
  "opentelemetry.*",
  "uvicorn.*",
  "respx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# --------------------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast isolated tests",
  "integration: tests requiring external infrastructure",
  "contract: provider contract tests",
  "architecture: architectural boundary tests",
  "security: security control tests",
  "resilience: resilience and failure-injection tests",
  "streaming: streaming/SSE tests",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]

# --------------------------------------------------------------------------------------
# Coverage
# --------------------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/ai_gateway"]
omit = [
  "src/ai_gateway/__main__.py",
  "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "@overload",
  "class .*Protocol.*:",
  "\\.\\.\\.",
]

# --------------------------------------------------------------------------------------
# Import Linter -- enforces Clean Architecture boundaries
# --------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "ai_gateway"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
  "ai_gateway.workers | ai_gateway.api",
  "ai_gateway.infrastructure",
  "ai_gateway.application",
  "ai_gateway.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is framework independent"
type = "forbidden"
source_modules = ["ai_gateway.domain"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "sqlalchemy",
  "redis",
  "aiokafka",
  "httpx",
  "pydantic",
  "pydantic_settings",
  "opentelemetry",
  "prometheus_client",
  "structlog",
  "jwt",
  "ai_gateway.application",
  "ai_gateway.infrastructure",
  "ai_gateway.api",
  "ai_gateway.workers",
  "ai_gateway.observability",
  "ai_gateway.config",
]

[[tool.importlinter.contracts]]
name = "Application depends on ports, never on concrete adapters"
type = "forbidden"
source_modules = ["ai_gateway.application"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "sqlalchemy",
  "redis",
  "aiokafka",
  "httpx",
  "ai_gateway.infrastructure",
  "ai_gateway.api",
  "ai_gateway.workers",
]

[[tool.importlinter.contracts]]
name = "Provider adapters are isolated from delivery mechanisms"
type = "forbidden"
source_modules = ["ai_gateway.infrastructure.providers"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "ai_gateway.api",
  "ai_gateway.workers",
  "ai_gateway.infrastructure.persistence",
]

[[tool.importlinter.contracts]]
name = "API layer does not import workers"
type = "forbidden"
source_modules = ["ai_gateway.api"]
forbidden_modules = ["ai_gateway.workers"]

[[tool.importlinter.contracts]]
name = "Observability is a leaf utility"
type = "forbidden"
source_modules = ["ai_gateway.observability"]
forbidden_modules = [
  "ai_gateway.api",
  "ai_gateway.workers",
  "ai_gateway.infrastructure",
  "ai_gateway.application",
]
