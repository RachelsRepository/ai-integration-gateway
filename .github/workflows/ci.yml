name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests migrations

      - name: Ruff format
        run: ruff format --check src tests migrations

      - name: MyPy
        run: PYTHONPATH=src mypy src tests

      - name: Import linter
        run: PYTHONPATH=src lint-imports

      - name: Pytest with coverage
        run: PYTHONPATH=src pytest --cov=ai_gateway --cov-report=term-missing --cov-report=xml -q

      - name: OpenAPI export
        run: PYTHONPATH=src python -m ai_gateway.cli openapi --output openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-integration-gateway:ci .

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  runtime:
    name: Runtime Compose
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Start HA stack
        run: docker compose --profile ha up --build -d

      - name: Wait for stack readiness
        run: |
          chmod +x scripts/*.sh
          REQUIRE_HA=1 \
            AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 \
            API_BASE_B=http://127.0.0.1:18003 \
            scripts/wait_for_stack.sh

      - name: Integration (SQLAlchemy UoW)
        run: |
          docker compose run --rm --entrypoint "" \
            -e AIGW_TEST_DB_DSN=postgresql+asyncpg://gateway:gateway@postgres:5432/gateway \
            -v "$PWD/tests:/tests:ro" \
            -v "$PWD/src:/src:ro" \
            api \
            sh -c 'pip install -q pytest pytest-asyncio aiosqlite && PYTHONPATH=/src pytest /tests/integration -q --tb=short'

      - name: Compose e2e
        run: |
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 scripts/e2e_compose.sh

      - name: Embeddings recreate regression
        run: |
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 RECREATE_ROUNDS=2 \
            scripts/recreate_embeddings_compose.sh

      - name: HA quota and scenario matrix
        run: |
          API_BASE_A=http://127.0.0.1:18000 API_BASE_B=http://127.0.0.1:18003 \
            AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            scripts/ha_quota_compose.sh

      - name: Provider failure matrix
        run: |
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 scripts/provider_matrix_compose.sh

      - name: Agent mid-run resume
        run: |
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 scripts/agent_resume_compose.sh

      - name: Chaos subset
        run: |
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 scripts/chaos_compose.sh

      - name: Load smoke
        run: |
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 LOAD_CONCURRENCY=4 LOAD_REQUESTS=20 \
            scripts/load_compose.sh

      - name: Second clean run
        run: |
          docker compose --profile ha down -v --remove-orphans
          docker compose --profile ha up --build -d
          REQUIRE_HA=1 \
            AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 \
            API_BASE_B=http://127.0.0.1:18003 \
            scripts/wait_for_stack.sh
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 scripts/e2e_compose.sh
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 RECREATE_ROUNDS=1 \
            scripts/recreate_embeddings_compose.sh
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE_A=http://127.0.0.1:18000 API_BASE_B=http://127.0.0.1:18003 \
            scripts/ha_quota_compose.sh
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 scripts/agent_resume_compose.sh
          AIGW_API_KEY=aigw_local_demo_key_do_not_use_in_prod_001 \
            API_BASE=http://127.0.0.1:18000 scripts/provider_matrix_compose.sh

      - name: Capture logs on failure
        if: failure()
        run: docker compose --profile ha logs --no-color | tail -400

      - name: Tear down
        if: always()
        run: docker compose --profile ha down -v --remove-orphans
