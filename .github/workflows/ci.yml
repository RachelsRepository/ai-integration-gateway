name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests migrations

      - name: Ruff format
        run: ruff format --check src tests migrations

      - name: MyPy
        run: PYTHONPATH=src mypy src tests

      - name: Import linter
        run: PYTHONPATH=src lint-imports

      - name: Pytest with coverage
        run: PYTHONPATH=src pytest --cov=ai_gateway --cov-report=term-missing --cov-report=xml -q

      - name: OpenAPI export
        run: PYTHONPATH=src python -m ai_gateway.cli openapi --output openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-integration-gateway:ci .

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
