repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.8
          - pydantic-settings>=2.4
          - types-redis
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: env PYTHONPATH=src lint-imports
        language: system
        pass_filenames: false
        always_run: true
